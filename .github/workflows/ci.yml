name: ci

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-wasip1, wasm32-unknown-unknown
      - name: Check formatting
        run: cargo fmt --check
      - name: Run clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Run clippy with RTSPS
        run: cargo clippy --all-targets --features rtsps --locked -- -D warnings
      - name: Run tests
        run: cargo test --all-targets
      - name: Run tests with RTSPS
        run: cargo test --all-targets --features rtsps
      - name: Build examples
        run: cargo build --examples
      - name: Build wasm examples
        run: cargo build --examples --target wasm32-wasip1 --features rtsps
      - uses: actions/setup-go@v5
        with:
          go-version-file: conformance/runtime/go.mod
          cache-dependency-path: conformance/runtime/go.sum
      - name: Run plugins under the agent's wazero runtime
        run: |
          cargo build --release --example clock-check --target wasm32-wasip1
          cargo build --release --example clock-check --target wasm32-unknown-unknown
          cd conformance/runtime
          CLOCK_CHECK_WASM_WASIP1="$GITHUB_WORKSPACE/target/wasm32-wasip1/release/examples/clock-check.wasm" \
          CLOCK_CHECK_WASM_UNKNOWN="$GITHUB_WORKSPACE/target/wasm32-unknown-unknown/release/examples/clock-check.wasm" \
            go test -count=1 ./...
      - name: Verify publish package
        run: cargo publish --dry-run --locked
