id: rtsp-check
name: RTSP Check
version: 0.1.0
entrypoint: run_check
runtime: wasi-preview1
outputs: serviceradar.plugin_result.v1
capabilities:
  - get_config
  - log
  - submit_result
  - tcp_connect
  - tcp_read
  - tcp_write
  - tcp_close
resources:
  requested_memory_mb: 64
  requested_cpu_ms: 2000
permissions:
  allowed_domains:
    - example.com
  allowed_ports:
    - 322
    - 554
    - 8554
