id: http-synthetic-journey
name: HTTP Synthetic Journey
version: 0.1.0
entrypoint: run_check
runtime: wasi-preview1
outputs: serviceradar.plugin_result.v1
capabilities:
  - get_config
  - log
  - submit_result
  - emit_telemetry
  - http_request
resources:
  requested_memory_mb: 64
  requested_cpu_ms: 2000
permissions:
  allowed_domains:
    - example.com
    - "*.example.com"
  allowed_ports:
    - 443
